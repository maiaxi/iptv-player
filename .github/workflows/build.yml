name: Build

# Every push to main and every PR builds a universal (Apple silicon + Intel) DMG and keeps it as a
# workflow artifact. Pushing a tag like v1.2.3 also publishes that DMG on the v1.2.3 release,
# creating the release if it doesn't exist yet.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
            VERSION="$BASE-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build universal DMG
        env:
          ARCHS: arm64 x86_64
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/make-dmg.sh

      - name: Check binary
        run: |
          BIN="build/IPTV Player.app/Contents/MacOS/IPTVPlayer"
          ARCHS_FOUND=$(lipo -archs "$BIN")
          echo "Architectures: $ARCHS_FOUND"
          [[ "$ARCHS_FOUND" == *arm64* && "$ARCHS_FOUND" == *x86_64* ]]
          # Only system libraries may be linked dynamically, or the app won't run on other Macs.
          # Library lines are indented; the unindented ones are per-architecture headers.
          if otool -L "$BIN" | grep -E "^\s" | grep -vE "^\s+(/System/Library|/usr/lib)/"; then
            echo "Unexpected non-system dylib dependency" >&2
            exit 1
          fi
          otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-${{ steps.version.outputs.version }}
          path: build/IPTV-Player-*.dmg
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DMG=$(ls build/IPTV-Player-*.dmg)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "IPTV Player ${TAG#v}" --generate-notes
          fi
